[tool.poetry]
name = "matrix-loading"
version = "0.1.0"
description = "Exercise 01 - dependency management with pip vs Poetry"
authors = ["student <student@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "*"
numpy = "*"
matplotlib = "*"
requests = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
